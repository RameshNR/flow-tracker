# Public web folder that holds the screenshots from src/main/resources/images, used for the images in the
# plugin's Overview tab (Settings -> Plugins). The IDE only shows description images from a web address.
# Example (a public GitHub repository):
#   pluginImagesUrl=https://raw.githubusercontent.com/<owner>/<repo>/main/src/main/resources/images
# Leave it empty to build the description without images.
pluginImagesUrl=https://raw.githubusercontent.com/RameshNR/flow-tracker/main/src/main/resources/images
